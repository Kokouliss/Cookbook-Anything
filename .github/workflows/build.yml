name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the debug app
        run: ./gradlew :core:domain:test :app:assembleDebug

      # Room writes the database schema during the build. It has to be committed, because future
      # versions need it to migrate users' recipes instead of losing them.
      - name: Check that the database schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::app/schemas is out of date. Commit the files printed below."
            git status --porcelain -- app/schemas
            find app/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload the installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookbook-anything-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
